<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OpsBase">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121513" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Field operations hub — store health and issue tracking">
  <title>OpsBase</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app">

  <header class="header">
    <div class="brand">OpsBase</div>
    <div class="header-stats" id="headerStats"></div>
  </header>

  <main class="main">

    <!-- STORES -->
    <section class="screen active" id="scStores" aria-labelledby="storesTitle">
      <div class="page-head">
        <div>
          <h1 class="page-title" id="storesTitle">Stores</h1>
          <p class="page-sub" id="storesSub">Loading…</p>
        </div>
        <button class="btn btn-ghost" id="addStoreBtn"><i class="ti ti-plus" aria-hidden="true"></i>Add store</button>
      </div>

      <div class="toolbar">
        <label class="search">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input type="search" id="storeSearch" placeholder="Store #, city or name" aria-label="Search stores">
        </label>
        <label class="toggle">
          <input type="checkbox" id="showInactive">
          <span>Show inactive</span>
        </label>
      </div>
      <div class="chips" id="storeChips" role="tablist" aria-label="Account"></div>

      <div id="storeList" class="store-groups">
        <div class="loading"><div class="spinner"></div>Loading stores…</div>
      </div>
    </section>

    <!-- ISSUES -->
    <section class="screen" id="scIssues" aria-labelledby="issuesTitle">
      <div class="page-head">
        <div>
          <h1 class="page-title" id="issuesTitle">Issues</h1>
          <p class="page-sub" id="issueCount">Loading…</p>
        </div>
      </div>

      <div class="toolbar">
        <label class="search">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input type="search" id="issueSearch" placeholder="Search issues" aria-label="Search issues">
        </label>
      </div>
      <div class="toolbar toolbar-selects">
        <select id="issueAcctFilter" aria-label="Account"><option value="">All accounts</option></select>
        <select id="issueCatFilter" aria-label="Type">
          <option value="">All types</option>
          <option>Safety</option><option>Cleaning</option><option>Equipment</option>
          <option>Access</option><option>Scheduling</option><option>Supplies</option><option>Other</option>
        </select>
      </div>
      <div class="chips" id="issueChips" role="tablist" aria-label="Status">
        <button class="chip active" data-val="active">Open</button>
        <button class="chip" data-val="in progress">In progress</button>
        <button class="chip" data-val="resolved">Resolved</button>
        <button class="chip" data-val="all">All</button>
      </div>

      <div class="issue-list" id="issueList">
        <div class="loading"><div class="spinner"></div>Loading issues…</div>
      </div>
    </section>

    <!-- LOG / EDIT ISSUE -->
    <section class="screen" id="scLog" aria-labelledby="logTitle">
      <div class="page-head">
        <div>
          <h1 class="page-title" id="logTitle">Log issue</h1>
          <p class="page-sub" id="logSub">Report a store problem</p>
        </div>
      </div>

      <form class="form" id="logForm" novalidate>
        <input type="hidden" id="logEditId">
        <div class="field">
          <label for="logStoreId">Store</label>
          <select id="logStoreId" required><option value="">Select store…</option></select>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="logCategory">Type</label>
            <select id="logCategory">
              <option>Cleaning</option><option>Safety</option><option>Equipment</option>
              <option>Access</option><option>Scheduling</option><option>Supplies</option><option>Other</option>
            </select>
          </div>
          <div class="field">
            <label for="logDate">Date</label>
            <input type="date" id="logDate">
          </div>
        </div>
        <div class="field">
          <label for="logDesc">What needs attention</label>
          <textarea id="logDesc" rows="4" placeholder="Stairs by Pizza missed two nights; Bonnie asked for both stairways tonight." required></textarea>
          <p class="field-error" id="logError" hidden></p>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="logStatus">Status</label>
            <select id="logStatus">
              <option value="open">Open</option>
              <option value="in progress">In progress</option>
              <option value="resolved">Resolved</option>
            </select>
          </div>
          <div class="field">
            <label for="logAssignee">Owner</label>
            <input type="text" id="logAssignee" placeholder="Davron">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="logCancelBtn" hidden>Cancel</button>
          <button type="submit" class="btn btn-primary" id="logSubmitBtn">Log issue</button>
        </div>
      </form>
    </section>

    <!-- STORE DETAIL -->
    <section class="screen" id="scDetail" aria-labelledby="detailTitle">
      <div class="detail-head">
        <button class="back" id="backBtn"><i class="ti ti-chevron-left" aria-hidden="true"></i>Stores</button>
        <button class="btn btn-ghost btn-sm" id="detailActiveBtn"></button>
      </div>
      <div class="detail-hero">
        <div class="score-ring" id="detailScore" aria-label="Health score"></div>
        <div class="detail-id">
          <h1 class="page-title" id="detailTitle"></h1>
          <p class="page-sub" id="detailSub"></p>
        </div>
      </div>
      <div class="stat-row" id="detailStats"></div>

      <div class="section-head">
        <h2 class="section-title">Issues</h2>
        <button class="btn btn-primary btn-sm" id="detailLogBtn"><i class="ti ti-plus" aria-hidden="true"></i>Log issue</button>
      </div>
      <div class="issue-list" id="detailIssueList"></div>
    </section>

    <!-- REPORTS -->
    <section class="screen" id="scReports" aria-labelledby="reportsTitle">
      <div class="page-head">
        <div>
          <h1 class="page-title" id="reportsTitle">Reports</h1>
          <p class="page-sub" id="reportsSub">Loading…</p>
        </div>
      </div>
      <div class="chips" id="reportChips" role="tablist" aria-label="Period">
        <button class="chip active" data-val="week">7 days</button>
        <button class="chip" data-val="month">30 days</button>
        <button class="chip" data-val="all">All time</button>
      </div>

      <div class="stat-row" id="reportKpis"></div>

      <div class="report-block">
        <h2 class="section-title">Health ranking</h2>
        <p class="section-note">Active stores, worst first. Tap a store to open it.</p>
        <div id="reportRanking"></div>
      </div>
      <div class="report-block">
        <h2 class="section-title">Issues by type</h2>
        <div id="reportByCategory"></div>
      </div>
      <div class="report-block">
        <h2 class="section-title">Logged vs resolved, last 14 days</h2>
        <div class="chart-box"><canvas id="trendChart" aria-label="Issues logged and resolved per day for the last 14 days" role="img"></canvas></div>
      </div>
    </section>

  </main>

  <nav class="bottom-nav" aria-label="Main">
    <button class="nav-item active" data-screen="stores"><i class="ti ti-building-store" aria-hidden="true"></i>Stores</button>
    <button class="nav-item" data-screen="issues"><i class="ti ti-alert-circle" aria-hidden="true"></i>Issues<span class="nav-badge" id="navBadge" hidden></span></button>
    <button class="nav-item" data-screen="log"><i class="ti ti-circle-plus" aria-hidden="true"></i>Log</button>
    <button class="nav-item" data-screen="reports"><i class="ti ti-chart-bar" aria-hidden="true"></i>Reports</button>
  </nav>
</div>

<!-- ADD STORE -->
<div class="sheet-overlay" id="addStoreModal">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="addStoreTitle">
    <div class="sheet-handle"></div>
    <h2 id="addStoreTitle">Add store</h2>
    <div class="field-row">
      <div class="field">
        <label for="newStoreAccount">Account</label>
        <select id="newStoreAccount">
          <option>Wegmans</option><option>Zara</option><option>Office Depot</option>
          <option>Food Lion</option><option>Giant Food</option><option>Solidcore</option>
        </select>
      </div>
      <div class="field">
        <label for="newStoreNum">Store number</label>
        <input type="text" id="newStoreNum" inputmode="numeric" placeholder="125">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="newStoreCity">City</label>
        <input type="text" id="newStoreCity" placeholder="Owings Mills">
      </div>
      <div class="field">
        <label for="newStoreState">State</label>
        <select id="newStoreState">
          <option>MD</option><option>PA</option><option>NJ</option><option>VA</option>
          <option>DC</option><option>DE</option><option>WV</option>
        </select>
      </div>
    </div>
    <p class="field-error" id="storeError" hidden></p>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelStore">Cancel</button>
      <button class="btn btn-primary" id="saveStoreBtn">Add store</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAction" hidden></button></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
